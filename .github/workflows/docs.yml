name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --dev
      - name: Build HTML and verify internal links
        run: uv run --offline python scripts/build_docs.py
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: build/site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.PAGES_ENABLED == 'true' &&
      !contains(github.event.head_commit.message, '[skip pages deploy]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
