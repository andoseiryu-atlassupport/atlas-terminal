name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --all-extras --dev
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and whitespace
        run: npm run check
      - name: Check Python style and types
        run: |
          uv run --offline ruff check .
          uv run --offline ruff format --check .
          uv run --offline mypy
      - name: Run offline acceptance tests
        run: uv run --offline pytest
      - name: Check public files for credential patterns
        run: python scripts/scan_public_files.py
      - name: Verify offline demonstrations
        run: |
          uv run --offline atlas demo --json
          uv run --offline python examples/free_research.py
          uv run --offline atlas research batch --input examples/research_batch.json --provider fixture --json
          uv run --offline python examples/mock_purchase.py
      - name: Build distribution
        run: uv run --offline python -m build --no-isolation
      - name: Prepare research plugin and validate documentation links
        run: |
          uv run --offline python scripts/prepare_distribution.py
          uv run --offline python scripts/build_docs.py
